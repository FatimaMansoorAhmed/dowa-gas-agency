# HTTPS is live (cert issued via Certbot for dowagasagency.com). Port 80
# still answers for ACME renewal challenges and redirects everything else
# to https.
#
# www not included in server_name — no DNS record / certificate for it yet.
# Add both (and re-issue the cert with -d www.dowagasagency.com) if wanted.

server {
    listen 80;
    server_name dowagasagency.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dowagasagency.com;

    ssl_certificate /etc/letsencrypt/live/dowagasagency.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dowagasagency.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Nginx strips the /api/ prefix here (trailing slash on proxy_pass) so
    # FastAPI's routes stay exactly as they are (e.g. /companies, /auth/me) —
    # no backend code change needed. frontend/lib/api.ts's NEXT_PUBLIC_API_URL
    # is built as "/api" to match.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
